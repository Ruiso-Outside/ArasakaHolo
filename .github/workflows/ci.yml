# Testes: só rodam quando alguém clica em Actions > Testes > Run workflow (não travam push nem Release).
name: Testes
on:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe do Python e dos scripts
        run: |
          python -m compileall -q arasaka_holo
          for f in *.sh; do bash -n "$f"; done
      - name: Abre o app sem tela e tira um print
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2 >/dev/null
          pip install -q "PySide6-Essentials>=6.5" "pynacl>=1.5" "websockets>=14" "aiortc>=1.10" "sounddevice>=0.4.6" "mss>=10" "numpy>=1.26"
          mkdir -p "$RUNNER_TEMP/home"
          QT_QPA_PLATFORM=offscreen HOME="$RUNNER_TEMP/home" ARASAKA_BLACKWALL_DEMO=1 timeout 120 python -m arasaka_holo --screenshot="$RUNNER_TEMP/tela.png"
          test -s "$RUNNER_TEMP/tela.png"
      - name: Identidade, criptografia e servidor WebSocket
        run: timeout 120 python tests/test_core.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium
          coverage: none
      - name: Relay por HTTP (copia em Python e o relay PHP de verdade)
        run: |
          php -l relay-php/index.php && php -l relay-php/holo-config.exemplo.php
          timeout 120 python tests/test_http_relay.py
          timeout 120 python tests/test_http_relay.py --php
      - name: Call (audio, tela, sala)
        run: timeout 180 python tests/test_calls.py
      - name: Interface (conversa, call direta, call de sala)
        run: QT_QPA_PLATFORM=offscreen timeout 240 python tests/test_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: tela
          path: ${{ runner.temp }}/tela.png
      - name: Visual igual ao ArasakaKit
        run: |
          for f in fx.py kit.py; do
            curl -fsSL "https://raw.githubusercontent.com/Ruiso-Outside/ArasakaKit/main/arasaka_kit/$f" -o "$RUNNER_TEMP/$f" || { echo "::warning::não consegui baixar $f do ArasakaKit"; continue; }
            cmp -s "$RUNNER_TEMP/$f" "arasaka_holo/$f" || echo "::warning::arasaka_holo/$f está diferente do ArasakaKit: rode ArasakaKit/sync.sh"
          done
